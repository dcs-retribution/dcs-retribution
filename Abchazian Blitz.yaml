name: Caucasus - Abchazian Blitz
theater: Caucasus
authors: Ramius
description: <p>Medium campaign, set during fictional georgian war. New pro-western georgian government, taking adventage of Western Europe deteriorating relations with Russia, made a bold move to retake separatist region of Abchazia, being secretly guaranteed by the NATO umbrella. Georgian operation after initial success, halted, after russian aeromobile forces, destroyed key bridges, practically stopping offensive in Sukhumi. Week later, Russia mobilized for counter attack, objective is lighting strike, to restore control over Abchazia, and push towards Enguri Dam, this should force Georgia to sue for peace, and allow to avoid costly city fights. Time is enemy! Additional objective, is destruction of air power, and supplies in Tbilisi, Batumi and Senaki, if NATO dare to intervene.</p>
 </p> If You decide to play as Georgia/NATO, get ready to be outnumbered, your air defence, and ground forces are not really on par, but your campaign difficulty (not mission difficulty!) will be easier. Optional, but higly recommended, are Codename Flanker Su-30 and Su-35S mods,and Hi Digit SAMs mod, that will create more challanging A2/AD bubbles around primary russian bases. All 3 mods are used in campaign order of battle.</p>  
