description: >-
  <p><strong>Note -</strong> A fictional long-range strike campaign. Israeli squadrons
  fly from the Negev with a US tanker, control and carrier package. Built for the UH-60L
  mod; New Game ticks it. The blue faction is Starfire's USA-Israel 2000, trimmed; the inline enemy faction follows Fuzzle's Operation Allied Sword.</p>
  <p>In 2004, a rupture between Ankara and Washington ended with Turkish airspace and
  Incirlik closed to coalition traffic. Moscow moved into the gap. Within the year, an
  air-defense protocol had put Russian long-range SAM regiments on the Anatolian plateau
  and Russian squadrons at Diyarbakir. Damascus, a Soviet client since the Cold War and
  isolated since its occupation of Lebanon drew sanctions, signed on as the third
  partner. The combined network now reaches from the Black Sea coast to the Golan.</p>
  <p>Israel cannot reach Anatolia alone. Every target that matters lies 250 to 400
  nautical miles from the Negev, and the direct routes run through the Syrian corridor.
  A US tanker and control package at Akrotiri and a carrier in the eastern Mediterranean
  are what let Israeli strike squadrons hold Turkish airfields at risk.</p>
  <p>The fight is in Turkey. Getting there is the campaign.</p>

# Retribution allows one faction per coalition, so an alliance has to be written
# inline. This follows Fuzzle's shipped Operation Allied Sword, which does the
# same thing on this map with its "Syria-Lebanon 2005 ... with several imported
# Russian assets" faction.
#
# Gated to 2004: no S-400 (SA-21, service 2007), no Buk-M2 (SA-17, 2008), no
# Su-34 (2014), no T-72B3 (2011). restrict_weapons_by_date gates WEAPONS but
# never SAM presets, so the period filtering here is manual and deliberate.
