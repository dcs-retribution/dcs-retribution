miz: anatolian_reach.miz
performance: 3
recommended_start_date: 2004-06-01
version: "10.9"

# The .miz carries comms towers, power sources and command centres, so the
# network is wired in range mode (comms <=15 nm, power <=35 nm) rather than by
# an explicit iads_config. Worth having in a campaign whose whole shape is SEAD
# and deep strike.
advanced_iads: true

settings:
  squadron_start_full: true
  # Tel Nof's Black Hawks are the UH-60L mod (Israeli Air Force paint).
  uh_60l: true
  # 2004 loadouts. Without this the Israeli jets carry weapons that postdate the
  # scenario by a decade and the long-range problem solves itself.
  restrict_weapons_by_date: true
  restrict_props_by_date: true
  # Default true; set here because the campaign is built around its tankers.
  autoplan_tankers_for_strike: true
  autoplan_tankers_for_oca: true
  autoplan_tankers_for_dead: true
  # One range for both sides. At 300 NM blue flies only BARCAPs; at 100-130 red
  # flies none. At 225 Tel Nof and Ben Gurion come into range and the Israeli
  # strikes collapse.
  airbase_threat_range: 200

# The .miz places a CVN-71. The loader only recognises the Stennis hull as a
# carrier, so the group must be a CVN-74 in the editor; this block paints it
# back to a Roosevelt in game.
carriers:
  Naval-1:
    preferred_name: CVN-71 Theodore Roosevelt
    preferred_type: CVN-71 Theodore Roosevelt

