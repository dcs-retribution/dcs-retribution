name: Caucasus - Abchazian Blitz
theater: Caucasus
authors: Ramius007
description: <p>Medium-sized and difficult campaign, set during fictional georgian war. In alternative 2018, new georgian government, taking adventage of EU deteriorating relations with Russia, made a bold move to retake separatist region of Abchazia. Georgian operation after initial success, halted, when VDV, cut off key bridges in Abchazia, and stopped offensive in Sukhumi. 2 weeks later(tm), Russia mobilized for a counter attack, to restore control, and push towards Enguri Dam. This is a first test for new Eurocorps, european defense initiative, with a goal of deterring Russia.<p>
 <p> Optional, but recommended, are both Codename Flanker mods, and Hi Digit SAMs, boosted by IADS plugin, this should create more challanging A2/AD bubbles. All 3 mods are used in campaign order of battle. If You are going to use those mods, replace M2000C squadron with something Fox-3 capable.<p>
 <p> For performance reasons, disable untasked aircrafts on first turn(s), as OCA is unlikely, culling should also help. Campaign make use of helicopters, and Hercules.<p> 
