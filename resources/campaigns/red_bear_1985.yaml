      secondary: any
      aircraft:
        - MiG-23MLD Flogger-K
      size: 12
    - primary: Strike
      secondary: any
      aircraft:
        - Su-17M4 Fitter-K
      size: 12
    - primary: CAS
      secondary: any
      aircraft:
        - Su-25 Frogfoot
      size: 12
    - primary: AEW&C
      aircraft:
        - A-50
      size: 1
    - primary: Transport
      aircraft:
        - An-26B
      size: 2
