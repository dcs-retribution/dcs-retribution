description:
  <p>In early 1999, Jordan's political transition following King Hussein's
  death created a brief window of vulnerability. Iraq exploited the succession
  change, denouncing Abdullah's accession as Western-backed while seeking to
  seize Jordanian airfields and establish a compliant regime from which it
  could project power against Israel.</p><p>The offensive opened with strikes
  on Muwaffaq Salti Air Base, crippling Jordan's fighter force before Iraqi
  columns crossed from the H-3 complex. With H-4, Prince Hassan and Muwaffaq Salti in
  Iraqi hands, the United States and Israel launched Operation Desert
  Trident to halt the advance and prevent Jordan becoming a forward base for
  Iraqi military operations.</p>
