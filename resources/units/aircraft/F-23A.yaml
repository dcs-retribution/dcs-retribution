description:
  The Northrop/McDonnell Douglas YF-23 was an advanced tactical fighter prototype
  developed for the USAF Advanced Tactical Fighter competition. This mod represents
  a fictional production F-23A variant, a stealth air superiority fighter with
  supercruise capability, internal weapons bays carrying AIM-120C AMRAAM and
  AIM-9X Sidewinder missiles.
