name: Python lint

on: workflow_call

jobs:
  black:
    name: Black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install "$(grep '^black==' requirements.txt)"
      - name: Black
        run: black --check .

  mypy:
    name: Type checking
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python environment
        uses: ./.github/actions/setup-liberation-python

      - name: mypy
        uses: ./.github/actions/mypy
