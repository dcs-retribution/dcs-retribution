[mypy]
# TODO: Cleanup so we can enable the checks commented out here.
check_untyped_defs = True
# disallow_any_decorated = True
# disallow_any_expr = True
disallow_any_generics = True
# disallow_any_unimported = True
disallow_untyped_decorators = True
disallow_untyped_defs = True
follow_imports = silent
# implicit_reexport = False
namespace_packages = True
no_implicit_optional = True
warn_redundant_casts = True
# warn_return_any = True
warn_unreachable = True
warn_unused_ignores = True
plugins = pydantic.mypy
# resources/ holds data files and standalone editor/import scripts, not part of
# the type-checked application (CI only ever runs `mypy game` / `mypy tests`).
# resources/tools has no __init__.py, so under namespace_packages it gets
# discovered under two different module names when the whole tree is scanned
# (bare `generate_landmap` via directory walk vs. dotted
# `resources.tools.generate_landmap` via the import in arcgis_landmap_import.py),
# which mypy rejects as a duplicate module.
exclude = (^|/)resources/

[mypy-faker.*]
ignore_missing_imports = True

[mypy-lupa.*]
ignore_missing_imports = True

[mypy-shapely.*]
# https://github.com/Toblerity/Shapely/issues/721
ignore_missing_imports = True

[mypy-uvicorn.*]
ignore_missing_imports = True